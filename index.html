<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einfacher 3D Ego Shooter</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Szene, Kamera und Renderer erstellen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Himmelblau
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Spieler erstellen
        const playerGeometry = new THREE.BoxGeometry(0.5, 1, 0.5);
        const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        scene.add(player);

        // Kamera initial positionieren
        camera.position.set(0, 1, 3);
        camera.lookAt(player.position);

        // Bewegung
        const keys = {};
        document.addEventListener('keydown', (event) => {
            keys[event.code] = true;
        });
        document.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });

        // Schießen
        const bullets = [];
        const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        document.addEventListener('mousedown', (event) => {
            if (event.button === 0) { // Linke Maustaste
                console.log("Linke Maustaste gedrückt!"); // Debugging-Ausgabe
                const bulletGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
                bullet.position.copy(camera.position);
                bullet.velocity = new THREE.Vector3();
                bullet.velocity.copy(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(10));
                bullets.push(bullet);
                scene.add(bullet);
                console.log("Kugel erstellt und zur Szene hinzugefügt."); // Debugging-Ausgabe
            }
        });

        // Gegner erstellen
        const enemies = [];
        const enemyMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
        for (let i = 0; i < 5; i++) {
            const enemyGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const enemy = new THREE.Mesh(enemyGeometry, enemyMaterial);
            enemy.position.set((Math.random() - 0.5) * 10, 0.25, (Math.random() - 0.5) * 10);
            enemies.push(enemy);
            scene.add(enemy);
        }

        // Boden hinzufügen
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2; // Boden horizontal ausrichten
        scene.add(floor);

        // Wände hinzufügen
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x888888 });
        const wallGeometry = new THREE.BoxGeometry(0.1, 2, 20);
        const wall1 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall1.position.set(-10, 1, 0);
        scene.add(wall1);

        const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall2.position.set(10, 1, 0);
        scene.add(wall2);

        const wall3 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall3.rotation.y = Math.PI / 2; // Wand drehen
        wall3.position.set(0, 1, -10);
        scene.add(wall3);

        const wall4 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall4.rotation.y = Math.PI / 2; // Wand drehen
        wall4.position.set(0, 1, 10);
        scene.add(wall4);

        // Animationsschleife
        function animate() {
            requestAnimationFrame(animate);

            // Spielerbewegung
            if (keys['ArrowUp'] || keys['KeyW']) player.position.z -= 0.1;
            if (keys['ArrowDown'] || keys['KeyS']) player.position.z += 0.1;
            if (keys['ArrowLeft'] || keys['KeyA']) player.position.x -= 0.1;
            if (keys['ArrowRight'] || keys['KeyD']) player.position.x += 0.1;

            // Kamera folgt dem Spieler
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 3; // Abstand zur Spielerposition
            camera.position.y = 1; // Höhe der Kamera
            camera.lookAt(player.position);

            // Kugeln bewegen und Kollisionserkennung
            bullets.forEach((bullet, bulletIndex) => {
                bullet.position.add(bullet.velocity);
                if (bullet.position.length() > 50) {
                    scene.remove(bullet);
                    bullets.splice(bulletIndex, 1);
                }

                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.position.distanceTo(enemy.position) < 0.5) {
                        console.log("Treffer!"); // Debugging-Ausgabe
                        scene.remove(bullet);
                        bullets.splice(bulletIndex, 1);
                        scene.remove(enemy);
                        enemies.splice(enemyIndex, 1);
                    }
                });
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
