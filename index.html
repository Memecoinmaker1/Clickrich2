<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einfacher 3D Ego Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Szene, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Spieler
        const playerGeometry = new THREE.BoxGeometry(0.5, 1, 0.5);
        const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        scene.add(player);

        // Kamera initialisieren
        camera.position.set(0, 1.6, 5);
        camera.lookAt(player.position);

        // Bewegung
        const keys = {};
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        // Schießen
        const bullets = [];
        const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        document.addEventListener('mousedown', (event) => {
            if (event.button === 0) { // Linke Maustaste
                const bulletGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
                bullet.position.copy(camera.position);
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                bullet.userData.velocity = direction.clone().multiplyScalar(0.5); // Geschwindigkeit
                bullets.push(bullet);
                scene.add(bullet);
            }
        });

        // Gegner
        const enemies = [];
        const enemyMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
        for (let i = 0; i < 5; i++) {
            const enemyGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const enemy = new THREE.Mesh(enemyGeometry, enemyMaterial);
            enemy.position.set((Math.random() - 0.5) * 10, 0.25, (Math.random() - 0.5) * 10);
            enemies.push(enemy);
            scene.add(enemy);
        }

        // Boden
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Wände
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x888888 });
        const wallGeometry = new THREE.BoxGeometry(0.1, 2, 20);
        const wall1 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall1.position.set(-10, 1, 0);
        scene.add(wall1);

        const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall2.position.set(10, 1, 0);
        scene.add(wall2);

        const wall3 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall3.rotation.y = Math.PI / 2;
        wall3.position.set(0, 1, -10);
        scene.add(wall3);

        const wall4 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall4.rotation.y = Math.PI / 2;
        wall4.position.set(0, 1, 10);
        scene.add(wall4);

        // Animationsloop
        function animate() {
            requestAnimationFrame(animate);

            // Bewegung
            if (keys['ArrowUp'] || keys['KeyW']) player.position.z -= 0.1;
            if (keys['ArrowDown'] || keys['KeyS']) player.position.z += 0.1;
            if (keys['ArrowLeft'] || keys['KeyA']) player.position.x -= 0.1;
            if (keys['ArrowRight'] || keys['KeyD']) player.position.x += 0.1;

            // Kamera folgt dem Spieler
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 3;
            camera.lookAt(player.position);

            // Kugeln bewegen
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.add(bullet.userData.velocity);

                // Entfernen, wenn zu weit
                if (bullet.position.length() > 100) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                    continue;
                }

                // Kollision mit Gegner
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (bullet.position.distanceTo(enemy.position) < 0.5) {
                        scene.remove(enemy);
                        enemies.splice(j, 1);
                        scene.remove(bullet);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
